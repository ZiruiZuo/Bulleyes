[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-bullseye"
version = "0.2.0"
description = "Interactive cardiac short-axis planning and patient-specific AHA-17 bullseye mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "nibabel>=5.2",
    "scikit-image>=0.22",
    "PyQt5>=5.15",
    "SimpleITK>=2.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
cardiac-short-axis = "cardiac_bullseye.cli:short_axis_main"
cardiac-bullseye = "cardiac_bullseye.cli:bullseye_main"
cardiac-pipeline = "cardiac_bullseye.cli:pipeline_main"
cardiac-lge-bullseye = "cardiac_bullseye.cli:lge_bullseye_main"
cardiac-lge-mask-bullseye = "cardiac_bullseye.cli:lge_mask_bullseye_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cardiac_bullseye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
